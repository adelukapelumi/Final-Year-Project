name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/react-frontend-mvp
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"
  pull_request:
    paths:
      - ".github/workflows/frontend.yml"
      - "frontend/**"

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Show tool versions
        run: |
          node --version
          pnpm --version

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build
