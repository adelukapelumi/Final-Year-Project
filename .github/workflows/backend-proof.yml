name: Backend Proof CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/backend-proof-integration
    paths:
      - ".github/workflows/backend-proof.yml"
      - "backend/**"
      - "proof_engine/winterfell/**"
  pull_request:
    paths:
      - ".github/workflows/backend-proof.yml"
      - "backend/**"
      - "proof_engine/winterfell/**"

permissions:
  contents: read

jobs:
  backend-proof-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies for backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Show tool versions
        run: |
          python --version
          rustc --version
          cargo --version

      - name: Build Winterfell proof engine
        run: cargo build --release --manifest-path proof_engine/winterfell/Cargo.toml

      - name: Run backend proof-backed tests
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v
